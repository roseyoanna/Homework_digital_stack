<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> One little piggy</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="piggy">
    <div class="piggy_left_ear "></div>
    <div class="piggy_right_ear"></div>
    <div class="piggy_head">
      <div class="piggy_eyes">
        <div class="piggy_left_eye">
          <div class="piggy_left_pupil"></div>
        </div>
        <div class="piggy_right_eye">
          <div class="piggy_right_pupil">
          </div>
        </div>
      </div>

      <div class="piggy_snout">
        <div class="piggy_left_nostril"></div>
        <div class="piggy_right_nostril"></div>
      </div>
    </div>
  </div>
</body>

</html>
